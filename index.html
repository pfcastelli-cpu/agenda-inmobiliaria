  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

#visita-app{--v-bg:light-dark(#f4f4f4,#111725);--v-surface:light-dark(#fff,#1a2233);--v-text:light-dark(#15233b,#edf2ff);--v-muted:light-dark(#586780,#a5b3cd);--v-line:light-dark(#e2e8f2,#303d54);--v-blue:light-dark(#1a2c45,#8eb0ff);--v-tint:light-dark(#e3f8f7,#253555);--v-green:light-dark(#177153,#78dab5);--v-greenbg:light-dark(#e8f6ef,#203f36);--v-red:light-dark(#b32f43,#ffa4ad);font:400 16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;color:var(--v-text);background:var(--v-bg);border-radius:24px;overflow:hidden;isolation:isolate;text-align:left}

#visita-app .v-teamcard{background:var(--v-surface);border:1px solid var(--v-line);border-radius:17px;padding:17px}
#visita-app .v-teamcard .v-avatar{width:45px;height:45px;font-size:14px}
#visita-app .v-teammeta{display:flex;gap:16px;margin:15px 0;color:var(--v-muted);font-size:13px}
#visita-app .v-loadtrack{height:5px;border-radius:10px;background:var(--v-line);overflow:hidden;margin-bottom:14px}
#visita-app .v-load{height:100%;background:var(--v-blue)}
#visita-app .v-step{display:flex;align-items:center;gap:8px;color:var(--v-muted);font-size:12px;margin:0 0 20px}
#visita-app .v-step b{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:var(--v-line);font-size:11px}
#visita-app .v-step .active{color:var(--v-blue);font-weight:600;display:flex;align-items:center;gap:6px}
#visita-app .v-step .active b{background:var(--v-blue);color:var(--v-surface)}
#visita-app .v-bookinghero{background:var(--v-tint);border-radius:16px;padding:17px;margin-bottom:20px}
#visita-app .v-bookinghero .v-muted{font-size:12px}
#visita-app .v-sectiontitle{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:650;margin-bottom:12px}
#visita-app .v-slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0 10px}
#visita-app .v-slot{background:var(--v-surface);border:1px solid var(--v-line);border-radius:11px;min-height:44px;font-size:14px;font-weight:500}
#visita-app .v-slot[aria-pressed=true]{background:#1a2c45;border-color:#1a2c45;color:#fff}
#visita-app .v-slot:disabled{text-decoration:line-through}
#visita-app .v-note{font-size:12px;color:var(--v-muted);margin-bottom:20px}
#visita-app .v-bookinggrid{display:grid;grid-template-columns:1fr 1fr;gap:25px}
#visita-app .v-full{width:100%}
#visita-app .v-error{color:var(--v-red);font-size:14px;margin:10px 0}
#visita-app .v-empty{padding:32px 18px;text-align:center;color:var(--v-muted);border:1px dashed var(--v-line);border-radius:16px;margin:14px 0}
#visita-app .v-empty svg{width:32px;height:32px;margin-bottom:10px}
#visita-app .v-success{background:var(--v-surface);border:1px solid var(--v-line);border-radius:22px;padding:26px 20px;max-width:480px;margin:15px auto;text-align:center}
#visita-app .v-successicon{display:grid;place-items:center;width:62px;height:62px;border-radius:50%;background:var(--v-greenbg);color:var(--v-green);margin:0 auto 16px}
#visita-app .v-successicon svg{width:32px;height:32px}
#visita-app .v-ticket{margin:23px 0;text-align:left;border-top:1px dashed var(--v-line);border-bottom:1px dashed var(--v-line);padding:18px 0;display:grid;gap:12px}
#visita-app .v-ticket .v-row{align-items:flex-start}
#visita-app .v-toast{padding:10px 22px;background:var(--v-greenbg);color:var(--v-green);font-size:14px}
#visita-app .v-toast:empty{display:none}
#visita-app .v-cancelbox{margin-top:10px;padding:12px;border:1px solid var(--v-line);border-radius:10px;font-size:13px}
#visita-app .v-footnote{text-align:center;color:var(--v-muted);font-size:11px;padding:9px 15px;background:var(--v-surface)}
@media(max-width:560px){#visita-app{border-radius:18px}#visita-app .v-header{padding:16px}#visita-app .v-content{padding:20px 15px;min-height:530px}#visita-app h2{font-size:26px}#visita-app .v-grid,#visita-app .v-bookinggrid{grid-template-columns:1fr}#visita-app .v-nav button{flex-direction:column;gap:3px;font-size:11px}#visita-app .v-appt{grid-template-columns:45px minmax(0,1fr);gap:7px}#visita-app .v-apptbody{padding:12px}#visita-app .v-day{border-radius:11px}#visita-app .v-days{gap:4px}#visita-app .v-actions button{min-height:44px}#visita-app .v-stat{padding:0 9px}#visita-app .v-bookinggrid{gap:8px}#visita-app .v-top&gt;.v-btn{padding:11px;font-size:13px}#visita-app .v-company{font-size:11px}}
@media(prefers-reduced-motion:no-preference){#visita-app .v-btn,#visita-app .v-day,#visita-app .v-slot{transition:background .15s,border-color .15s}#visita-app .v-primary:hover{background:#00a9a5}}
&lt;/style&gt;
&lt;div id=&quot;visita-app&quot;&gt;
  &lt;header class=&quot;v-header&quot;&gt;
    &lt;div class=&quot;v-row&quot;&gt;&lt;div class=&quot;v-logo&quot;&gt;&lt;i data-lucide=&quot;calendar-range&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;v-brand&quot;&gt;visita&lt;span style=&quot;color:var(--v-blue)&quot;&gt;.&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;v-company&quot;&gt;PATRIMONIOS · BOGOTÁ&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;span class=&quot;v-demo&quot;&gt;Demo interactiva&lt;/span&gt;
  &lt;/header&gt;
  &lt;nav class=&quot;v-nav&quot; aria-label=&quot;Navegación principal&quot;&gt;
    &lt;button type=&quot;button&quot; data-view=&quot;agenda&quot; aria-current=&quot;page&quot;&gt;&lt;i data-lucide=&quot;calendar-days&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Agenda&lt;/button&gt;
    &lt;button type=&quot;button&quot; data-view=&quot;properties&quot;&gt;&lt;i data-lucide=&quot;building-2&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Inmuebles · 100&lt;/button&gt;
    &lt;button type=&quot;button&quot; data-view=&quot;team&quot;&gt;&lt;i data-lucide=&quot;users&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Equipo · 10&lt;/button&gt;
  &lt;/nav&gt;
  &lt;div id=&quot;v-toast&quot; class=&quot;v-toast&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;main id=&quot;v-main&quot; class=&quot;v-content&quot;&gt;&lt;/main&gt;
  &lt;div class=&quot;v-footnote&quot;&gt;Datos ficticios · Horarios de Bogotá · Cambios solo en esta sesión&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
(() =&gt; {
  &#x27;use strict&#x27;;
  const root=document.getElementById(&#x27;visita-app&#x27;);
  const main=root.querySelector(&#x27;#v-main&#x27;);
  const toast=root.querySelector(&#x27;#v-toast&#x27;);
  const duration=40, travel=30, baseDate=&#x27;2026-09-07&#x27;;
  const tenantId=&#x27;patrimonios-demo&#x27;;
  const names=[&#x27;Valentina Ríos&#x27;,&#x27;Mateo Beltrán&#x27;,&#x27;Camila Torres&#x27;,&#x27;Daniel Acosta&#x27;,&#x27;Sofía Mendoza&#x27;,&#x27;Nicolás Vélez&#x27;,&#x27;Isabella Ruiz&#x27;,&#x27;Sebastián Mora&#x27;,&#x27;Mariana Castro&#x27;,&#x27;Tomás Herrera&#x27;];
  const zones=[&#x27;Cedritos&#x27;,&#x27;Chicó&#x27;,&#x27;Colina Campestre&#x27;,&#x27;Usaquén&#x27;,&#x27;Chapinero&#x27;,&#x27;Salitre&#x27;,&#x27;Santa Bárbara&#x27;,&#x27;Suba&#x27;,&#x27;Rosales&#x27;,&#x27;Teusaquillo&#x27;];
  const colors=[&#x27;#426fe2&#x27;,&#x27;#a66adc&#x27;,&#x27;#268979&#x27;,&#x27;#be7745&#x27;,&#x27;#ba6489&#x27;,&#x27;#578dce&#x27;,&#x27;#8b7bc7&#x27;,&#x27;#4e949e&#x27;,&#x27;#ab793e&#x27;,&#x27;#6b89a5&#x27;];
  const advisors=names.map((name,i)=&gt;({id:&#x27;a&#x27;+i,tenantId,name,zone:zones[i],color:colors[i],start:480+(i%3)*30,end:1050+(i%2)*30,initials:name.split(&#x27; &#x27;).map(n=&gt;n[0]).join(&#x27;&#x27;)}));
  const properties=Array.from({length:100},(_,i)=&gt;({id:601+i,tenantId,advisorId:advisors[i%10].id,zone:zones[i%10],type:i%9===0?&#x27;Casa&#x27;:i%7===0?&#x27;Local&#x27;:&#x27;Apartamento&#x27;,mode:i%4===0?&#x27;Venta&#x27;:&#x27;Arriendo&#x27;,area:45+(i*17)%210,rooms:1+i%4,baths:1+i%3,price:i%4===0?350000000+(i*23000000)%1900000000:1400000+(i*170000)%7200000,address:`${i%2?&#x27;Carrera&#x27;:&#x27;Calle&#x27;} ${25+(i*7)%140} # ${8+(i*3)%60} – ${10+(i*11)%80}`,start:540+(i%3)*30,end:960+(i%3)*30,saturday:i%4!==0}));
  const clients=[&#x27;Laura Martínez&#x27;,&#x27;Andrés Gómez&#x27;,&#x27;Juliana Pérez&#x27;,&#x27;Carlos Moreno&#x27;,&#x27;Paula Medina&#x27;,&#x27;David López&#x27;,&#x27;Ana Vargas&#x27;,&#x27;Felipe Ortiz&#x27;,&#x27;Diana León&#x27;,&#x27;Santiago Díaz&#x27;];
  let appointments=[];
  let nextId=1;
  const state={view:&#x27;agenda&#x27;,date:baseDate,week:0,advisor:&#x27;all&#x27;,query:&#x27;&#x27;,zone:&#x27;all&#x27;,mode:&#x27;all&#x27;,page:0,limit:6,property:null,slot:null,editId:null,client:&#x27;&#x27;,cancelId:null,successId:null};
  const money=new Intl.NumberFormat(&#x27;es-CO&#x27;,{style:&#x27;currency&#x27;,currency:&#x27;COP&#x27;,maximumFractionDigits:0});
  const escape=s=&gt;String(s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
  const icon=name=&gt;`&lt;i data-lucide=&quot;${name}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;
  const prop=id=&gt;properties.find(p=&gt;p.id===Number(id));
  const advisor=id=&gt;advisors.find(a=&gt;a.id===id);
  const dateObj=s=&gt;new Date(s+&#x27;T12:00:00Z&#x27;);
  const addDays=(s,n)=&gt;{const d=dateObj(s);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
  const dateLabel=s=&gt;new Intl.DateTimeFormat(&#x27;es-CO&#x27;,{weekday:&#x27;long&#x27;,day:&#x27;numeric&#x27;,month:&#x27;long&#x27;,timeZone:&#x27;UTC&#x27;}).format(dateObj(s));
  const time=n=&gt;`${String(Math.floor(n/60)).padStart(2,&#x27;0&#x27;)}:${String(n%60).padStart(2,&#x27;0&#x27;)}`;
  const activeAppointments=()=&gt;appointments.filter(a=&gt;a.tenantId===tenantId&amp;&amp;a.status!==&#x27;cancelled&#x27;);
  function windowFor(p,date){
    const day=dateObj(date).getUTCDay(),a=advisor(p.advisorId);
    if(day===0||(day===6&amp;&amp;!p.saturday))return null;
    return {start:Math.max(a.start,p.start),end:Math.min(day===6?780:a.end,day===6?780:p.end)};
  }
  function canBook(p,date,start,ignoreId=null){
    const w=windowFor(p,date);
    if(!w||start&lt;w.start||start+duration&gt;w.end)return false;
    return !activeAppointments().some(b=&gt;{
      if(b.id===ignoreId||b.date!==date)return false;
      if(b.advisorId!==p.advisorId&amp;&amp;b.propertyId!==p.id)return false;
      const buffer=b.propertyId===p.id?0:travel;
      return start&lt;b.start+duration+buffer&amp;&amp;start+duration+buffer&gt;b.start;
    });
  }
  function slotsFor(p,date,ignoreId=null){
    const w=windowFor(p,date);if(!w)return [];
    const result=[];for(let t=Math.ceil(w.start/30)*30;t+duration&lt;=w.end;t+=30)result.push({time:t,available:canBook(p,date,t,ignoreId)});return result;
  }
  // Seed appointments through the same scheduling rules used by the booking form.
  for(let d=0;d&lt;14;d++){
    const date=addDays(baseDate,d);
    advisors.forEach((a,i)=&gt;{
      const p=properties[(d%10)*10+i];
      for(const start of [600,840])if(canBook(p,date,start))appointments.push({id:&#x27;v&#x27;+nextId++,tenantId,propertyId:p.id,advisorId:a.id,date,start,client:clients[(i+d)%clients.length],status:&#x27;confirmed&#x27;});
    });
  }
  function avatar(a){return `&lt;span class=&quot;v-avatar&quot;&gt;${a.initials}&lt;/span&gt;`}
  function notify(text){toast.textContent=text}
  function refreshIcons(){if(typeof lucide!==&#x27;undefined&#x27;)lucide.createIcons({attrs:{&#x27;stroke-width&#x27;:1.8}})}
  function nav(){root.querySelectorAll(&#x27;[data-view]&#x27;).forEach(b=&gt;{if(b.dataset.view===state.view||(state.view===&#x27;booking&#x27;&amp;&amp;b.dataset.view===&#x27;properties&#x27;))b.setAttribute(&#x27;aria-current&#x27;,&#x27;page&#x27;);else b.removeAttribute(&#x27;aria-current&#x27;)})}
  function setView(view){state.view=view;state.cancelId=null;state.limit=6;notify(&#x27;&#x27;);render()}
  function dateStrip(booking=false){
    const first=addDays(baseDate,state.week*7);
    return `&lt;div class=&quot;v-between&quot;&gt;&lt;div&gt;&lt;strong style=&quot;font-size:14px&quot;&gt;Septiembre 2026&lt;/strong&gt;&lt;div class=&quot;v-muted&quot; style=&quot;font-size:12px&quot;&gt;${booking?&#x27;Elige el día de visita&#x27;:&#x27;Semana de demostración&#x27;}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;v-row&quot;&gt;&lt;button class=&quot;v-iconbtn&quot; data-week=&quot;-1&quot; aria-label=&quot;Semana anterior&quot; ${state.week===0?&#x27;disabled&#x27;:&#x27;&#x27;}&gt;${icon(&#x27;chevron-left&#x27;)}&lt;/button&gt;&lt;button class=&quot;v-iconbtn&quot; data-week=&quot;1&quot; aria-label=&quot;Semana siguiente&quot; ${state.week===1?&#x27;disabled&#x27;:&#x27;&#x27;}&gt;${icon(&#x27;chevron-right&#x27;)}&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;v-days&quot;&gt;${Array.from({length:7},(_,i)=&gt;{
      const date=addDays(first,i),d=dateObj(date),count=booking?slotsFor(prop(state.property),date,state.editId).filter(s=&gt;s.available).length:activeAppointments().filter(a=&gt;a.date===date&amp;&amp;(state.advisor===&#x27;all&#x27;||a.advisorId===state.advisor)).length;
      return `&lt;button type=&quot;button&quot; class=&quot;v-day&quot; data-date=&quot;${date}&quot; aria-pressed=&quot;${state.date===date}&quot; aria-label=&quot;${dateLabel(date)}, ${count} ${booking?&#x27;horarios libres&#x27;:&#x27;citas&#x27;}&quot;&gt;&lt;span&gt;${[&#x27;dom&#x27;,&#x27;lun&#x27;,&#x27;mar&#x27;,&#x27;mié&#x27;,&#x27;jue&#x27;,&#x27;vie&#x27;,&#x27;sáb&#x27;][d.getUTCDay()]}&lt;/span&gt;&lt;strong&gt;${d.getUTCDate()}&lt;/strong&gt;&lt;small&gt;${count?count+(booking?&#x27; libres&#x27;:&#x27; citas&#x27;):&#x27;—&#x27;}&lt;/small&gt;&lt;/button&gt;`}).join(&#x27;&#x27;)}&lt;/div&gt;`;
  }
  function appointmentCard(b){
    const p=prop(b.propertyId),a=advisor(b.advisorId);
    return `&lt;article class=&quot;v-appt&quot;&gt;&lt;div class=&quot;v-time&quot;&gt;${time(b.start)}&lt;small&gt;${time(b.start+duration)}&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;v-apptbody&quot; style=&quot;--advisor-color:${a.color}&quot;&gt;
      &lt;div class=&quot;v-between&quot;&gt;&lt;span class=&quot;v-muted&quot; style=&quot;font-size:11px&quot;&gt;#${p.id} · ${p.mode}&lt;/span&gt;&lt;span class=&quot;v-tag ${b.status===&#x27;completed&#x27;?&#x27;v-tag-neutral&#x27;:&#x27;&#x27;}&quot;&gt;${b.status===&#x27;completed&#x27;?&#x27;Realizada&#x27;:&#x27;Confirmada&#x27;}&lt;/span&gt;&lt;/div&gt;
      &lt;h3 style=&quot;margin-top:6px&quot;&gt;${p.type} en ${p.zone}&lt;/h3&gt;&lt;div class=&quot;v-apptmeta&quot;&gt;&lt;span&gt;${b.client?escape(b.client):&#x27;Cliente de prueba&#x27;}&lt;/span&gt;&lt;span&gt;· ${duration} min&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;v-row&quot;&gt;${avatar(a)}&lt;span class=&quot;v-advisorname&quot;&gt;${a.name}&lt;/span&gt;&lt;/div&gt;
      ${b.status===&#x27;completed&#x27;?&#x27;&#x27;:`&lt;div class=&quot;v-actions&quot;&gt;&lt;button data-edit=&quot;${b.id}&quot;&gt;Reprogramar&lt;/button&gt;&lt;button data-complete=&quot;${b.id}&quot;&gt;Realizada&lt;/button&gt;&lt;button class=&quot;v-danger&quot; data-cancel=&quot;${b.id}&quot;&gt;Cancelar&lt;/button&gt;&lt;/div&gt;`}
      ${state.cancelId===b.id?`&lt;div class=&quot;v-cancelbox&quot;&gt;¿Cancelar esta visita y liberar el horario?&lt;div class=&quot;v-actions&quot;&gt;&lt;button class=&quot;v-danger&quot; data-confirmcancel=&quot;${b.id}&quot;&gt;Sí, cancelar&lt;/button&gt;&lt;button data-keep=&quot;${b.id}&quot;&gt;Conservar&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`:&#x27;&#x27;}
    &lt;/div&gt;&lt;/article&gt;`;
  }
  function renderAgenda(){
    const today=activeAppointments().filter(a=&gt;a.date===state.date&amp;&amp;(state.advisor===&#x27;all&#x27;||a.advisorId===state.advisor)).sort((a,b)=&gt;a.start-b.start||a.advisorId.localeCompare(b.advisorId));
    const completed=today.filter(a=&gt;a.status===&#x27;completed&#x27;).length;
    main.innerHTML=`&lt;div class=&quot;v-top&quot;&gt;&lt;div&gt;&lt;div class=&quot;v-eyebrow&quot;&gt;Tu operación, al día&lt;/div&gt;&lt;h2&gt;Agenda de visitas&lt;/h2&gt;&lt;/div&gt;&lt;button class=&quot;v-btn v-primary&quot; data-new&gt;${icon(&#x27;plus&#x27;)}Nueva cita&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;v-statbar&quot;&gt;&lt;div class=&quot;v-stat&quot;&gt;&lt;strong&gt;${today.length}&lt;/strong&gt;&lt;span&gt;Citas del día&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;v-stat&quot;&gt;&lt;strong&gt;${new Set(today.map(a=&gt;a.advisorId)).size}&lt;/strong&gt;&lt;span&gt;Asesores con citas&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;v-stat&quot;&gt;&lt;strong&gt;${completed}&lt;/strong&gt;&lt;span&gt;Realizadas&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      ${dateStrip()}&lt;label class=&quot;v-field&quot; for=&quot;v-advisor&quot;&gt;Ver agenda de&lt;select id=&quot;v-advisor&quot; class=&quot;v-input&quot;&gt;&lt;option value=&quot;all&quot;&gt;Todo el equipo · 10 asesores&lt;/option&gt;${advisors.map(a=&gt;`&lt;option value=&quot;${a.id}&quot; ${state.advisor===a.id?&#x27;selected&#x27;:&#x27;&#x27;}&gt;${a.name} · ${a.zone}&lt;/option&gt;`).join(&#x27;&#x27;)}&lt;/select&gt;&lt;/label&gt;
      &lt;div class=&quot;v-between&quot;&gt;&lt;h3 style=&quot;text-transform:capitalize&quot;&gt;${dateLabel(state.date).split(&#x27; de septiembre&#x27;)[0]}&lt;/h3&gt;&lt;span class=&quot;v-muted&quot;&gt;${today.length} visitas&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;v-list&quot;&gt;${today.length?today.slice(0,state.limit).map(appointmentCard).join(&#x27;&#x27;):`&lt;div class=&quot;v-empty&quot;&gt;${icon(&#x27;calendar-check&#x27;)}&lt;h3&gt;Agenda despejada&lt;/h3&gt;&lt;p style=&quot;margin-top:8px&quot;&gt;No hay visitas para este día y asesor.&lt;/p&gt;&lt;button class=&quot;v-btn v-primary&quot; data-new style=&quot;margin-top:16px&quot;&gt;Agendar una visita&lt;/button&gt;&lt;/div&gt;`}&lt;/div&gt;
      ${today.length&gt;state.limit?`&lt;button class=&quot;v-btn v-full&quot; data-more style=&quot;margin-top:15px&quot;&gt;Ver ${today.length-state.limit} citas más ${icon(&#x27;chevron-down&#x27;)}&lt;/button&gt;`:&#x27;&#x27;}`;
  }
