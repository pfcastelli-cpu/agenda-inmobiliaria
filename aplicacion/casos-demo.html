<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Casos · vista de prueba</title>
    <meta name="robots" content="noindex">
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./estilos/agenda.css">
    <style>body{margin:0;font-family:'Hanken Grotesk',system-ui,sans-serif;background:#f4f6fb;color:#1A2C45}
      #demo-aviso{background:#FFF4D6;border-bottom:1px solid #E0B94A;padding:8px 16px;font-size:13px}
      #casos-demo{max-width:1100px;margin:0 auto;padding:16px}
      .v-btn{font:inherit;border:1px solid #c9d2e3;border-radius:10px;padding:8px 14px;background:#fff;cursor:pointer;color:#1A2C45}
      .v-btn.v-primary{background:#1A2C45;color:#fff;border-color:#1A2C45}
      .v-input{font:inherit;padding:8px 10px;border:1px solid #c9d2e3;border-radius:8px;background:#fff}
      .v-field{display:grid;gap:4px;font-size:13px}.v-eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#586780}
      .v-top{display:flex;justify-content:space-between;align-items:flex-end}.v-contador{background:#D43228;color:#fff;border-radius:999px;padding:0 7px;font-size:12px}
      .v-muted{color:#586780}.v-note{color:#586780;font-size:13px}.v-error{color:#B3261E}</style>
  </head>
  <body>
    <div id="demo-aviso"><strong>Vista de prueba.</strong> Datos reales de Sedi y del seguimiento de asambleas, sin nombres ni cédulas. Todo vive en la memoria de esta página: no guarda nada ni toca la base de datos.</div>
    <main id="casos-demo"></main>
    <script type="module" src="./js/casos-demo.js"></script>
  </body>
</html>
