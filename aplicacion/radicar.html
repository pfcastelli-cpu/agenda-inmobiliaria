<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radica tu estudio · Patrimonios Inmobiliarios</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/estilos/reservar.css">
  <style>
    html, body { margin: 0; min-height: 100%; background: #f4f4f4; }
    .rd-fila { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #ececec; }
    .rd-fila small { color: #6b6b6b; display: block; }
    .rd-fila strong { overflow-wrap: anywhere; }
    .rd-copiar { flex: none; border: 1px solid currentColor; background: transparent; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
    .rd-paso { display: flex; gap: 12px; margin: 10px 0; align-items: flex-start; }
    .rd-num { flex: none; width: 26px; height: 26px; line-height: 26px; text-align: center; border-radius: 999px; background: #1a2c45; color: #fff; font-weight: 600; font-size: 13px; }
  </style>
</head>
<body>
<div id="pub-app">
  <header class="pu-head">
    <div><strong>PATRIMONIOS</strong><small>INMOBILIARIOS</small></div>
    <span class="pu-badge" style="border-color:rgba(255,255,255,.4);color:#fff">Tu siguiente paso</span>
  </header>
  <main id="pu-main"></main>
  <div class="pu-foot">Patrimonios Inmobiliarios · Bogotá · Barranquilla · Medellín</div>
</div>
<script type="module" src="/js/radicar.js"></script>
</body>
</html>
