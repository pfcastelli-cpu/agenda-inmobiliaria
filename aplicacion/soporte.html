<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soporte de plataforma</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --tinta: #1a2c45; --acento: #00a9a5; --linea: #dfe5ea; --fondo: #f4f6f8; --texto: #2b3440; --suave: #6b7785; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--fondo); color: var(--texto); font-family: 'Hanken Grotesk', Arial, sans-serif; font-size: 15px; line-height: 1.5; }
    header { background: var(--tinta); color: #fff; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    header strong { font-size: 17px; letter-spacing: .02em; }
    header small { opacity: .75; margin-left: 8px; }
    main { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }
    h2 { margin: 0 0 4px; font-size: 22px; color: var(--tinta); }
    .tarjeta { background: #fff; border: 1px solid var(--linea); border-radius: 14px; padding: 16px 18px; }
    .fila { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin: 14px 0; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--suave); font-weight: 600; flex: 1 1 200px; }
    input, select, textarea, button { font: inherit; }
    input, select, textarea { padding: 10px 12px; border: 1px solid var(--linea); border-radius: 10px; background: #fff; color: var(--texto); width: 100%; }
    textarea { min-height: 84px; resize: vertical; }
    button { padding: 10px 16px; border-radius: 10px; border: 1px solid var(--linea); background: #fff; color: var(--tinta); font-weight: 600; cursor: pointer; min-height: 44px; }
    button.principal { background: var(--tinta); border-color: var(--tinta); color: #fff; }
    button:disabled { opacity: .6; cursor: default; }
    .error { color: #b3261e; margin: 8px 0; font-weight: 600; }
    .ok { color: #05603a; margin: 8px 0; font-weight: 600; }
    .suave { color: var(--suave); font-size: 13px; }
    .etiqueta { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid var(--linea); background: #fff; }
    article.ticket { border-left: 4px solid var(--tinta); }
    article.ticket + article.ticket { margin-top: 12px; }
    .cabeza { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
    .nota { margin: 8px 0 0; padding: 10px 12px; background: #fff7e0; border-radius: 10px; white-space: pre-wrap; }
    .respuesta { margin: 8px 0 0; padding: 10px 12px; background: #eef3f7; border-radius: 10px; white-space: pre-wrap; }
    pre.diag { margin: 10px 0 0; padding: 12px; background: #0f1b2d; color: #d7e3f1; border-radius: 10px; overflow: auto; font-size: 12.5px; max-height: 420px; }
    .metricas { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 10px; }
    .metrica { border: 1px solid var(--linea); border-radius: 12px; padding: 10px 12px; background: #fff; }
    .metrica.alerta { border-color: #e0a45a; background: #fff8ec; }
    .metrica .valor { font-size: 22px; font-weight: 700; color: var(--tinta); }
    .dos { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
    .barra { display: grid; grid-template-columns: 34px 1fr 28px; align-items: center; gap: 6px; font-size: 13px; }
    .barra i { display: block; height: 10px; background: #f59e0b; border-radius: 6px; min-width: 2px; }
    .tabla { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tabla th, .tabla td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--linea); }
    .hilo { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--linea); }
    .hilo .msg, .hilo .nota { padding: 10px 12px; line-height: 1.45; border-radius: 12px; white-space: pre-wrap; word-break: break-word; max-width: 90%; }
    .hilo .msg.solicitante { background: #f4f4f4; align-self: flex-end; }
    .hilo .msg.soporte, .hilo .msg.empresa { background: #eef3f7; align-self: flex-start; }
    .hilo .nota { background: #fff7e0; border: 1px dashed #e0a45a; align-self: flex-start; }
    .hilo .evento { text-align: center; font-size: 12px; color: var(--suave); }
    .campo-nota { background: #fffbf0; border-color: #e0a45a; }
    .login { max-width: 400px; margin: 60px auto; }
    .login form { display: flex; flex-direction: column; gap: 12px; }
    .login form label { flex: none; }
  </style>
</head>
<body>
<header>
  <div><strong>Soporte de plataforma</strong><small id="quien"></small></div>
  <div style="display:flex;align-items:center;gap:12px"><div id="campana"></div><button type="button" id="salir" hidden>Cerrar sesión</button></div>
</header>
<main id="raiz"><p class="suave">Cargando…</p></main>
<script type="module" src="/js/soporte.js"></script>
</body>
</html>
